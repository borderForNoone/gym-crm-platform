spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: gym-core-service
          uri: lb://gym-core-service
          predicates:
            - Path=/gym-crm-application/**
        - id: workload-service
          uri: lb://workload-service
          predicates:
            - Path=/workload-service/**

server:
  port: ${API_GATEWAY_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: true