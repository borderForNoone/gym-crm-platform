spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gym_db
    username: gymuser
    password: gympass
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_boolean_jdbc_type: TINYINT
  activemq:
    broker-url: tcp://localhost:61616
    user: gym
    password: gym

workload:
  service:
    base-url: ${WORKLOAD_SERVICE_URL:}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.gym.crm: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/