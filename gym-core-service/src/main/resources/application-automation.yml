spring:
  application:
    name: gym-core-service
  datasource:
    url: jdbc:h2:mem:gym;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: true
  liquibase:
    enabled: false

  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: gym
    password: gym

  data:
    redis:
      repositories:
        enabled: false

jwt:
  secret: test-secret
  expiration: 86400000

server:
  port: 8080

workload:
  service:
    base-url: http://localhost:8082/workload-service

app:
  cors:
    allowed-origins: http://localhost:3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/