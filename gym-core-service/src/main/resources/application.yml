spring:
  application:
    name: gym-core-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    change-log: classpath:db/migration/master.xml
    enabled: true

logging:
  pattern:
    level: "%5p [txId=%X{transactionId}]"

springdoc:
  swagger-ui:
    url: /gia-api.yml
    path: /swagger-ui/index.html
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  service-expiration: 300000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

workload:
  service:
    base-url: ${WORKLOAD_SERVICE_URL:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
  instance:
    prefer-ip-address: true