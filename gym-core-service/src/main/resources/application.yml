spring:
  application:
    name: gym-core-service
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/migration/master.xml
    enabled: true
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL}
    user: ${ACTIVEMQ_USER}
    password: ${ACTIVEMQ_PASSWORD}
  jms:
    pub-sub-domain: false

activemq:
  destination:
    trainer-workload: trainer-workload-queue

logging:
  pattern:
    level: "%5p [txId=%X{transactionId}]"

springdoc:
  swagger-ui:
    url: /gia-api.yml
    path: /swagger-ui/index.html
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

workload:
  service:
    base-url: ${WORKLOAD_SERVICE_URL:}

resilience4j:
  circuitbreaker:
    instances:
      workloadServiceClient:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      workloadServiceClient:
        timeout-duration: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
  instance:
    prefer-ip-address: true