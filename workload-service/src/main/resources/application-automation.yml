spring:
  datasource:
    url: jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=true
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  activemq:
    broker-url: tcp://localhost:61616
    user: gym
    password: gym
  data:
    redis:
      repositories:
        enabled: false

jwt:
  secret: test-secret
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:3000

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

workload:
  messaging:
    consumer:
      concurrency: 1-5