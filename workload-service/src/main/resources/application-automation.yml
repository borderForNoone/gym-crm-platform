spring:
  datasource:
    url: jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=true
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  activemq:
    broker-url: tcp://localhost:61616
    user: gym
    password: gym
    in-memory: true
  data:
    redis:
      host: localhost
      port: 6379

de.flapdoodle.mongodb.embedded.version: 7.0.4

jwt:
  secret: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:3000

server:
  port: 8082

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

workload:
  messaging:
    consumer:
      concurrency: 1-5

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: TRACE