api:
  base-path: /api/v1

eureka:
  client:
    enabled: false

spring:
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: gym
    password: gym
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/workload_service_test
    jms:
      listener:
        auto-startup: false

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key
  expiration: 3600000

activemq:
  destination:
    trainer-workload: trainer-workload-queue
    trainer-workload-dlq: trainer-workload-dlq
  redelivery:
    max-redeliveries: 3

workload:
  messaging:
    consumer:
      concurrency: 2