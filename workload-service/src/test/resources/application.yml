api:
  base-path: /api/v1

eureka:
  client:
    enabled: false

spring:
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: admin
    password: admin

activemq:
  destination:
    trainer-workload: trainer-workload-queue
    trainer-workload-dlq: trainer-workload-dlq
  redelivery:
    max-redeliveries: 3

workload:
  messaging:
    consumer:
      concurrency: 2