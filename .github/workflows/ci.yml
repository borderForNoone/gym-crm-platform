name: CI - Build, Test and SonarCloud

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and run tests + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean verify -pl gym-core-service -am

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn sonar:sonar
          -pl gym-core-service
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.projectKey=borderForNoone_gym-crm-platform
          -Dsonar.organization=borderfornoone
          -Dsonar.coverage.jacoco.xmlReportPaths=gym-core-service/target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
          -Dsonar.maven.scanAll=false